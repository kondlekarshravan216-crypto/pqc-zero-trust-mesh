apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: zero-trust-demo
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - sleep 3600
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: zero-trust-demo
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
