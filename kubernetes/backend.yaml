apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: zero-trust-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              mkdir -p /www
              echo zero-trust-backend-ok > /www/index.html
              httpd -f -p 8080 -h /www
          ports:
            - containerPort: 8080
---
