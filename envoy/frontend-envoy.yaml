
# Frontend Envoy: HTTP ingress and mTLS upstream to backend Envoy.
# Envoy v1.39.3

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9902

static_resources:
  listeners:
    - name: frontend_egress_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: frontend_egress
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "[%START_TIME%] \"%REQ(:METHOD)% %REQ(:PATH)%\" %RESPONSE_CODE% flags=%RESPONSE_FLAGS% upstream_tls_fail=%UPSTREAM_TRANSPORT_FAILURE_REASON%\n"
                route_config:
                  name: to_backend
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: backend_mtls
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: backend_mtls
      type: STRICT_DNS
      connect_timeout: 3s
      load_assignment:
        cluster_name: backend_mtls
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: backend-envoy
                      port_value: 8443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: backend
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: TLSv1_3
              tls_maximum_protocol_version: TLSv1_3
              ecdh_curves:
                - X25519MLKEM768
                - X25519
                - P-256
            tls_certificates:
              - certificate_chain:
                  filename: /etc/pqzt/certs/frontend.crt
                private_key:
                  filename: /etc/pqzt/certs/frontend.key
            validation_context:
              trusted_ca:
                filename: /etc/pqzt/certs/ca.crt
              match_typed_subject_alt_names:
                - san_type: URI
                  matcher:
                    exact: "spiffe://pqzt.local/ns/demo/sa/backend"
