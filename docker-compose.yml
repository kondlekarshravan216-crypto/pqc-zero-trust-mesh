services:
  backend-app:
    image: python:3.12-alpine
    command: ["python", "/app/app.py"]
    volumes:
      - "./backend/app.py:/app/app.py:ro"
    networks:
      - backend_internal

  backend-envoy:
    image: envoyproxy/envoy:v1.39.3
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command:
      - "-c"
      - "/etc/envoy/envoy.yaml"
      - "--log-level"
      - "info"
    volumes:
      - "./envoy/backend-envoy.yaml:/etc/envoy/envoy.yaml:ro"
      - "${CERT_DIR:?Set CERT_DIR in .env}/backend.crt:/etc/pqzt/certs/backend.crt:ro"
      - "${CERT_DIR:?Set CERT_DIR in .env}/backend-envoy.key:/etc/pqzt/certs/backend.key:ro"
      - "${CERT_DIR:?Set CERT_DIR in .env}/ca.crt:/etc/pqzt/certs/ca.crt:ro"
    ports:
      - "127.0.0.1:18443:8443"
    depends_on:
      - backend-app
      - opa-service
    networks:
      - frontend_backend
      - backend_internal
      - opa_authz

  opa-service:
    image: openpolicyagent/opa:1.22.2-envoy
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--set=plugins.envoy_ext_authz_grpc.addr=:9191"
      - "--set=plugins.envoy_ext_authz_grpc.path=authz/allow"
      - "/policies"
    volumes:
      - "./opa/policies:/policies:ro"
    ports:
      - "127.0.0.1:8181:8181"
    networks:
      - opa_authz

  frontend-envoy:
    image: envoyproxy/envoy:v1.39.3
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command:
      - "-c"
      - "/etc/envoy/envoy.yaml"
      - "--log-level"
      - "info"
    volumes:
      - "./envoy/frontend-envoy.yaml:/etc/envoy/envoy.yaml:ro"
      - "${CERT_DIR:?Set CERT_DIR in .env}/frontend.crt:/etc/pqzt/certs/frontend.crt:ro"
      - "${CERT_DIR:?Set CERT_DIR in .env}/frontend-envoy.key:/etc/pqzt/certs/frontend.key:ro"
      - "${CERT_DIR:?Set CERT_DIR in .env}/ca.crt:/etc/pqzt/certs/ca.crt:ro"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend-envoy
    networks:
      - frontend_backend

networks:
  # Only frontend Envoy and backend Envoy share this east-west network.
  frontend_backend: {}
  # Backend application is isolated from frontend Envoy and OPA.
  backend_internal:
    internal: true
  # Only backend Envoy can call the OPA Envoy ext_authz gRPC endpoint.
  opa_authz:
    internal: true
