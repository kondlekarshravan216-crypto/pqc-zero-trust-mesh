services:
  backend-app:
    image: python:3.12-alpine
    command: ["python", "/app/app.py"]
    volumes:
      - "./backend/app.py:/app/app.py:ro"
    networks:
      - mesh

  backend-envoy:
    image: envoyproxy/envoy:v1.39.3
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command:
      - "-c"
      - "/etc/envoy/envoy.yaml"
      - "--log-level"
      - "info"
    volumes:
      - "./envoy/backend-envoy.yaml:/etc/envoy/envoy.yaml:ro"
      - "${CERT_DIR:?Set CERT_DIR in .env}/backend.crt:/etc/pqzt/certs/backend.crt:ro"
      - "${CERT_DIR:?Set CERT_DIR in .env}/backend-envoy.key:/etc/pqzt/certs/backend.key:ro"
      - "${CERT_DIR:?Set CERT_DIR in .env}/ca.crt:/etc/pqzt/certs/ca.crt:ro"
    ports:
      - "127.0.0.1:18443:8443"
    depends_on:
      - backend-app
    networks:
      - mesh

  frontend-envoy:
    image: envoyproxy/envoy:v1.39.3
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command:
      - "-c"
      - "/etc/envoy/envoy.yaml"
      - "--log-level"
      - "info"
    volumes:
      - "./envoy/frontend-envoy.yaml:/etc/envoy/envoy.yaml:ro"
      - "${CERT_DIR:?Set CERT_DIR in .env}/frontend.crt:/etc/pqzt/certs/frontend.crt:ro"
      - "${CERT_DIR:?Set CERT_DIR in .env}/frontend-envoy.key:/etc/pqzt/certs/frontend.key:ro"
      - "${CERT_DIR:?Set CERT_DIR in .env}/ca.crt:/etc/pqzt/certs/ca.crt:ro"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend-envoy
    networks:
      - mesh

networks:
  mesh: {}
