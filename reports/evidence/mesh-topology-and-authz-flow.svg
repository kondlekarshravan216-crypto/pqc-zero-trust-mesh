<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#080b12; font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="600" fill="url(#gradBg)"/>

  <!-- Top Header Bar -->
  <rect x="20" y="20" width="960" height="65" rx="12" fill="rgba(15,22,36,0.8)" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
  <text x="45" y="52" fill="#00f0ff" font-size="20" font-weight="700">PQC Zero-Trust Mesh | Visual Telemetry &amp; Verification Evidence</text>
  <text x="45" y="72" fill="#94a3b8" font-size="12">Verified: 05 November 2026 | Member 5: Manideep (OPA, Vault &amp; Dashboard Lead) | 61/61 Tests PASS (100%)</text>
  
  <rect x="760" y="38" width="100" height="28" rx="6" fill="rgba(16,185,129,0.2)" stroke="#10b981"/>
  <text x="810" y="56" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">100% VERIFIED</text>
  
  <rect x="870" y="38" width="95" height="28" rx="6" fill="rgba(139,92,246,0.2)" stroke="#8b5cf6"/>
  <text x="917" y="56" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">VAULT PKI v2</text>

  <!-- Metric Badges Row -->
  <g transform="translate(20, 105)">
    <rect width="225" height="70" rx="10" fill="rgba(15,22,36,0.7)" stroke="rgba(255,255,255,0.08)"/>
    <text x="18" y="30" fill="#94a3b8" font-size="11">OPA Unit &amp; Contract Tests</text>
    <text x="18" y="56" fill="#10b981" font-size="22" font-weight="700">28 / 28 PASS</text>
  </g>
  <g transform="translate(265, 105)">
    <rect width="225" height="70" rx="10" fill="rgba(15,22,36,0.7)" stroke="rgba(255,255,255,0.08)"/>
    <text x="18" y="30" fill="#94a3b8" font-size="11">Service Path mTLS Vectors</text>
    <text x="18" y="56" fill="#10b981" font-size="22" font-weight="700">15 / 15 PASS</text>
  </g>
  <g transform="translate(510, 105)">
    <rect width="225" height="70" rx="10" fill="rgba(15,22,36,0.7)" stroke="rgba(255,255,255,0.08)"/>
    <text x="18" y="30" fill="#94a3b8" font-size="11">Vault PKI &amp; Rotation Tests</text>
    <text x="18" y="56" fill="#10b981" font-size="22" font-weight="700">14 / 14 PASS</text>
  </g>
  <g transform="translate(755, 105)">
    <rect width="225" height="70" rx="10" fill="rgba(15,22,36,0.7)" stroke="rgba(255,255,255,0.08)"/>
    <text x="18" y="30" fill="#94a3b8" font-size="11">Dashboard Evaluator Probes</text>
    <text x="18" y="56" fill="#00f0ff" font-size="22" font-weight="700">4 / 4 HEALTHY</text>
  </g>

  <!-- Interactive Mesh Topology Graph -->
  <g transform="translate(20, 200)">
    <rect width="960" height="375" rx="12" fill="rgba(11,16,28,0.9)" stroke="rgba(255,255,255,0.08)"/>
    <text x="30" y="35" fill="#f1f5f9" font-size="16" font-weight="600">Zero-Trust Microsegmentation Perimeter &amp; Request Flow</text>
    
    <!-- Path 1: Frontend -> Backend (ALLOW) -->
    <path d="M 180 140 L 410 140" stroke="url(#gradGreen)" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="295" cy="140" r="5" fill="#10b981" filter="url(#glowGreen)"/>
    <text x="295" y="125" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">mTLS + OPA: ALLOW (200 OK)</text>

    <!-- Path 2: Backend -> Database (ALLOW) -->
    <path d="M 550 140 L 780 140" stroke="url(#gradGreen)" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="665" cy="140" r="5" fill="#10b981" filter="url(#glowGreen)"/>
    <text x="665" y="125" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">Backend -> DB: ALLOW (200 OK)</text>

    <!-- Path 3: Frontend -> Database (DENIED Lateral Movement) -->
    <path d="M 180 160 C 350 250, 600 250, 780 165" stroke="url(#gradRed)" stroke-width="2.5" stroke-dasharray="4,4"/>
    <circle cx="480" cy="225" r="5" fill="#f43f5e" filter="url(#glowRed)"/>
    <text x="480" y="245" fill="#f43f5e" font-size="11" font-weight="700" text-anchor="middle">BLOCK: Lateral Movement to Database (403 Forbidden)</text>

    <!-- Path 4: Vault SDS -> Backend Hot-Swap -->
    <path d="M 480 320 L 480 185" stroke="url(#gradPurple)" stroke-width="2.5" stroke-dasharray="5,3"/>
    <text x="495" y="270" fill="#c084fc" font-size="10" font-weight="600">Vault SDS Hot-Swap (V2)</text>

    <!-- Node 1: Frontend -->
    <g transform="translate(60, 100)">
      <rect width="120" height="80" rx="10" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5"/>
      <text x="60" y="32" fill="#f1f5f9" font-size="14" font-weight="700" text-anchor="middle">Frontend</text>
      <text x="60" y="50" fill="#94a3b8" font-size="11" text-anchor="middle">demo / frontend</text>
      <text x="60" y="68" fill="#38bdf8" font-size="9" text-anchor="middle">SVID: .../sa/frontend</text>
    </g>

    <!-- Node 2: Backend + Envoy + OPA ext_authz -->
    <g transform="translate(410, 95)">
      <rect width="140" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="70" y="28" fill="#f1f5f9" font-size="14" font-weight="700" text-anchor="middle">Backend Envoy</text>
      <text x="70" y="46" fill="#10b981" font-size="11" text-anchor="middle">mTLS + ext_authz</text>
      <text x="70" y="64" fill="#94a3b8" font-size="10" text-anchor="middle">OPA: authz.rego (v1)</text>
      <text x="70" y="80" fill="#c084fc" font-size="9" text-anchor="middle">SDS Rotated: V2</text>
    </g>

    <!-- Node 3: Database -->
    <g transform="translate(780, 100)">
      <rect width="120" height="80" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="60" y="32" fill="#f1f5f9" font-size="14" font-weight="700" text-anchor="middle">Database</text>
      <text x="60" y="50" fill="#94a3b8" font-size="11" text-anchor="middle">Isolated Segment</text>
      <text x="60" y="68" fill="#f59e0b" font-size="9" text-anchor="middle">Backend-only access</text>
    </g>

    <!-- Node 4: Vault PKI Coordinator -->
    <g transform="translate(390, 310)">
      <rect width="180" height="55" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="90" y="26" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle">HashiCorp Vault PKI</text>
      <text x="90" y="44" fill="#c084fc" font-size="10" text-anchor="middle">pki_mesh / 12h Short-Lived TTL</text>
    </g>
  </g>
</svg>

